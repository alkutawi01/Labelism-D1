<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log In — Labelism</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card {
      width: 100%;
      max-width: 320px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px 28px;
    }
    .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="topbar-mark">L</span>
      <strong>Labelism</strong>
    </div>
    <p class="muted" style="margin-top:-14px">Log masuk dengan akaun anda sendiri.</p>

    <form id="form">
      <label>Nama
        <input name="name" type="text" required autofocus autocomplete="username">
      </label>
      <label>Kata Laluan
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit">Log In</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = document.getElementById('result');
      result.innerHTML = '';
      const data = new FormData(e.target);
      const name = data.get('name');
      const password = data.get('password');
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, password }),
      }).then(r => r.json());
      if (res.error) {
        result.innerHTML = `<div class="msg error">${res.error}</div>`;
        return;
      }
      location.href = '/';
    });
  </script>
</body>
</html>
