<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — Labelism</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="topbar-mark" aria-hidden="true">L</span>
        <strong>Labelism</strong>
      </div>
      <h1>Sign in</h1>
      <p class="muted">Use your own account, so the system knows who did what.</p>

      <form id="form" class="mt-4">
        <label>Name
          <input name="name" type="text" required autofocus autocomplete="username" autocapitalize="off">
        </label>
        <label>Password
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn-primary btn-block btn-lg">Sign in</button>
      </form>

      <div id="result" aria-live="polite"></div>
    </div>
  </main>

  <script src="/ui.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = document.getElementById('result');
      result.innerHTML = '';
      const data = new FormData(e.target);
      const button = e.target.querySelector('button[type=submit]');
      try {
        const res = await UI.busy(button, () => fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: data.get('name'), password: data.get('password') }),
        }).then((r) => r.json()));
        if (res.error) { result.innerHTML = `<div class="msg error">${UI.esc(res.error)}</div>`; return; }
        location.href = '/';
      } catch {
        result.innerHTML = '<div class="msg error">Could not reach the server. Check the connection and try again.</div>';
      }
    });
  </script>
</body>
</html>
