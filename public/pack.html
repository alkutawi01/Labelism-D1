<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pack &amp; Ship — Labelism</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
  <header class="page-header">
    <h1>Pack &amp; Ship</h1>
    <p class="muted">Scan units into a shipment to confirm an order is fulfilled correctly -- this is a different check from Stocktake (which confirms warehouse presence, not customer fulfillment).</p>
  </header>

  <fieldset>
    <legend>Order Line</legend>
    <label>Which order line is this shipment for?
      <select id="line-select"><option value="">Loading…</option></select>
    </label>
    <div id="order-rollup" class="muted"></div>
    <div id="existing-shipments" class="muted"></div>
  </fieldset>

  <fieldset>
    <legend>New Shipment</legend>
    <form id="shipment-form">
      <label>Reference
        <input name="reference" required placeholder="e.g. Shipment 1">
      </label>
      <label>Planned quantity for this shipment
        <input name="plannedQuantity" type="number" min="1" required placeholder="e.g. 60">
      </label>
      <button type="submit">Open Shipment</button>
    </form>
  </fieldset>

  <div id="shipment-result"></div>

  <fieldset id="scan-section" hidden>
    <legend>Scan Units</legend>
    <div class="stats" id="shipment-stats">
      <div class="stat"><div class="value" id="s-planned">0</div><div class="label">Planned</div></div>
      <div class="stat"><div class="value" id="s-packed">0</div><div class="label">Packed</div></div>
    </div>
    <form id="scan-form">
      <label>Scan / enter code
        <input name="code" autofocus placeholder="000001">
      </label>
      <button type="submit">Record Scan</button>
    </form>
    <div id="scan-result"></div>
    <button id="close-btn" class="secondary" style="margin-top:16px">Close Shipment</button>
    <div id="close-result"></div>
  </fieldset>
  </div>

  <script src="/nav.js"></script>
  <script>
    let currentShipmentId = null;
    let linesById = new Map();

    async function loadLines() {
      const orders = await fetch('/api/orders').then(r => r.json());
      const select = document.getElementById('line-select');
      const allLines = orders.flatMap((o) => o.lines.map((l) => ({ ...l, orderRef: o.order_reference, customerName: o.customer_name })));
      if (!allLines.length) {
        select.innerHTML = '<option value="">No order lines yet -- create one in Orders</option>';
        return;
      }
      linesById = new Map(allLines.map((l) => [l.id, l]));
      select.innerHTML = allLines.map((l) =>
        `<option value="${l.id}">${l.customerName} · ${l.orderRef} · ${l.description || (l.product_name + ' ' + l.variant_label)} (${l.quantity_ordered})</option>`
      ).join('');
      loadExistingShipments();
    }

    // Field Simulation P3 (Shipment Split): fixes two real gaps found when
    // an order is fulfilled across multiple shipments -- (1) there was no
    // order-level rollup, only a raw per-shipment list an operator had to
    // add up by hand, and (2) reloading this page (browser closed, staff
    // shift change, crash) made an already-OPEN shipment permanently
    // unreachable -- there was no way to resume scanning into or even
    // close it, since currentShipmentId only ever got set at the moment a
    // NEW shipment was created in this page's own memory.
    // O5 finding: this rollup only ever refreshed on line-select or after
    // Close/Dispatch -- while actively scanning into an OPEN shipment, it
    // sat frozen at whatever it read on page load, showing "Packed: 0"
    // even as the scan-section stats right below correctly climbed to 1,
    // 2, 3... Split out so a scan can refresh just this number without
    // touching (or hiding) the active scan section itself.
    async function refreshOrderRollup(lineId) {
      const rollupEl = document.getElementById('order-rollup');
      const line = linesById.get(lineId);
      if (!line) { rollupEl.textContent = ''; return; }
      const rows = await fetch(`/api/order-lines/${lineId}/shipments`).then(r => r.json());
      const packedTotal = rows.reduce((sum, s) => sum + s.scanned_count, 0);
      rollupEl.textContent = `Ordered: ${line.quantity_ordered} · Packed: ${packedTotal} · Remaining: ${Math.max(0, line.quantity_ordered - packedTotal)}`;
      // Same staleness applied to each shipment's own row (e.g. "Shipment 1
      // (OPEN, 1/60)" frozen while the live scan count was already at 2) --
      // update it in place rather than re-rendering the whole list, which
      // would also nuke any open dispatch-destination input mid-type.
      for (const s of rows) {
        const span = document.getElementById(`shipment-row-label-${s.id}`);
        if (span) span.textContent = `${s.reference} (${s.status}, ${s.scanned_count}/${s.planned_quantity})`;
      }
      return rows;
    }

    async function loadExistingShipments() {
      const lineId = document.getElementById('line-select').value;
      const el = document.getElementById('existing-shipments');
      document.getElementById('scan-section').hidden = true;
      currentShipmentId = null;
      if (!lineId) { document.getElementById('order-rollup').textContent = ''; el.textContent = ''; return; }
      const rows = await refreshOrderRollup(lineId);
      if (!rows.length) {
        el.innerHTML = 'No shipments yet for this line.';
        return;
      }
      el.innerHTML = rows.map((s) => `
        <div style="margin:4px 0">
          <span id="shipment-row-label-${s.id}">${s.reference} (${s.status}, ${s.scanned_count}/${s.planned_quantity})</span>
          ${s.status === 'OPEN' ? ` <button type="button" class="secondary" data-resume="${s.id}" style="padding:2px 8px;font-size:12px">Resume</button>` : ''}
          ${s.status === 'CLOSED' ? ` <button type="button" class="secondary" data-dispatch-open="${s.id}" style="padding:2px 8px;font-size:12px">Dispatch</button>` : ''}
          <div class="dispatch-form" id="dispatch-form-${s.id}" hidden style="margin-top:4px">
            <input type="text" placeholder="Destination (e.g. Customer -- School ABC)" data-dispatch-location="${s.id}" style="font-size:12px;padding:4px">
            <button type="button" data-dispatch-confirm="${s.id}" style="padding:2px 8px;font-size:12px">Confirm Dispatch</button>
          </div>
        </div>
      `).join('');
      el.querySelectorAll('button[data-resume]').forEach((btn) => {
        btn.addEventListener('click', () => resumeShipment(btn.dataset.resume));
      });
      // Dispatch is deliberately its own step, separate from Close --
      // Field Simulation P4 found closing a shipment never actually moved
      // units anywhere, so "closed" and "left the building" need to stay
      // distinguishable (a closed-but-undispatched shipment is real and
      // common: packed today, courier picks up tomorrow).
      el.querySelectorAll('button[data-dispatch-open]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.getElementById(`dispatch-form-${btn.dataset.dispatchOpen}`).hidden = false;
        });
      });
      el.querySelectorAll('button[data-dispatch-confirm]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const shipmentId = btn.dataset.dispatchConfirm;
          const locationName = el.querySelector(`[data-dispatch-location="${shipmentId}"]`).value.trim();
          if (!locationName) return;
          const res = await fetch(`/api/shipments/${shipmentId}/dispatch`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ locationName, actor: 'izzat' }),
          }).then(r => r.json());
          if (res.error) {
            el.querySelector(`#dispatch-form-${shipmentId}`).insertAdjacentHTML('beforeend', `<div class="msg error">${res.error}</div>`);
            return;
          }
          loadExistingShipments();
        });
      });
    }
    document.getElementById('line-select').addEventListener('change', loadExistingShipments);

    async function resumeShipment(shipmentId) {
      const shipment = await fetch(`/api/shipments/${shipmentId}`).then(r => r.json());
      if (shipment.error) return;
      currentShipmentId = shipmentId;
      document.getElementById('shipment-result').innerHTML = `<div class="msg ok">Resumed shipment "${shipment.reference}".</div>`;
      document.getElementById('scan-section').hidden = false;
      document.getElementById('s-planned').textContent = shipment.planned_quantity;
      document.getElementById('s-packed').textContent = shipment.scannedCount;
      document.getElementById('scan-result').innerHTML = '';
      document.getElementById('close-result').innerHTML = '';
    }

    document.getElementById('shipment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = document.getElementById('shipment-result');
      result.innerHTML = '';
      try {
        const orderLineId = document.getElementById('line-select').value;
        if (!orderLineId) throw new Error('Select an order line first.');
        const data = Object.fromEntries(new FormData(e.target));
        const shipment = await fetch('/api/shipments', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderLineId, reference: data.reference, plannedQuantity: Number(data.plannedQuantity) }),
        }).then(r => r.json());
        if (shipment.error) throw new Error(shipment.error);

        currentShipmentId = shipment.id;
        result.innerHTML = `<div class="msg ok">Shipment "${shipment.reference}" opened.</div>`;
        document.getElementById('scan-section').hidden = false;
        document.getElementById('s-planned').textContent = shipment.plannedQuantity;
        document.getElementById('s-packed').textContent = 0;
        e.target.reset();
      } catch (err) {
        result.innerHTML = `<div class="msg error">${err.message}</div>`;
      }
    });

    document.getElementById('scan-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const code = new FormData(form).get('code').trim();
      const result = document.getElementById('scan-result');
      try {
        const httpRes = await fetch(`/api/shipments/${currentShipmentId}/scans`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, actor: 'izzat' }),
        });
        const res = await httpRes.json();
        if (res.error) {
          result.innerHTML = `<div class="msg error">${res.error}</div>`;
        } else {
          result.innerHTML = `<div class="msg ${res.alreadyScanned ? 'error' : 'ok'}">${res.humanCode} · ${res.product}${res.alreadyScanned ? ' -- already scanned' : ' -- packed'}</div>`;
          const shipment = await fetch(`/api/shipments/${currentShipmentId}`).then(r => r.json());
          document.getElementById('s-packed').textContent = shipment.scannedCount;
          if (!res.alreadyScanned) refreshOrderRollup(document.getElementById('line-select').value);
        }
      } catch (err) {
        result.innerHTML = `<div class="msg error">Could not reach the server (${err.message}).</div>`;
      }
      form.reset();
      form.code.focus();
    });

    document.getElementById('close-btn').addEventListener('click', async () => {
      const res = await fetch(`/api/shipments/${currentShipmentId}/close`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ actor: 'izzat' }),
      }).then(r => r.json());
      const message = res.error
        ? `<div class="msg error">${res.error}</div>`
        : `<div class="msg ${res.missing > 0 ? 'error' : 'ok'}">Closed. Planned ${res.plannedQuantity}, packed ${res.packedCount}${res.missing > 0 ? `, MISSING ${res.missing}` : ''}.</div>`;
      document.getElementById('close-result').innerHTML = message;
      if (!res.error) {
        // O5 finding: loadExistingShipments() hides the whole scan-section
        // (including #close-result) as soon as it runs, so the missing-
        // count confirmation flashed and vanished before an operator could
        // read it. Show it where it survives that hide -- #shipment-result
        // sits above the section that gets hidden.
        document.getElementById('shipment-result').innerHTML = message;
        loadExistingShipments();
      }
    });

    loadLines();
  </script>
</body>
</html>
