<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <title>Scan Packing — Labelism</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .packing-intro { max-width: 760px; font-size: 15px; line-height: 1.55; }
    .start-card { margin-top: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .start-card button { font-size: 17px; padding: 12px 18px; }
    .scan-box { border: 2px solid var(--navy); border-radius: 10px; padding: 18px; margin-top: 20px; }
    .scan-box input { font-size: 20px; padding: 13px; }
    .scan-box button[type="submit"] { font-size: 17px; padding: 12px 18px; }
  </style>
</head>
<body>
  <div class="page">
  <header class="page-header">
    <h1>Scan Masa Packing</h1>
    <p class="muted packing-intro">Pilih tempahan yang sedang dibungkus, kemudian scan setiap label. Sistem akan terus menunjukkan berapa unit sudah discan dan berapa yang masih kurang.</p>
  </header>

  <fieldset>
    <legend>1. Pilih Tempahan untuk Packing</legend>
    <label>Customer
      <select id="customer-select"><option value="">Memuatkan…</option></select>
    </label>
    <label>No. Tempahan / Invois
      <select id="invoice-select"><option value="">Pilih customer dahulu</option></select>
    </label>
    <label>Batch / Produk
      <select id="batch-select"><option value="">Pilih tempahan dahulu</option></select>
    </label>
    <div id="order-rollup" class="muted"></div>
    <div class="start-card">
      <div id="selected-batch-summary" class="muted">Pilih tempahan dan batch dahulu.</div>
      <button type="button" id="start-packing-btn" disabled>Mula Scan Packing</button>
    </div>
    <div id="existing-shipments" class="muted"></div>
  </fieldset>

  <div id="shipment-result"></div>

  <fieldset id="scan-section" class="scan-box" hidden>
    <legend>2. Scan Semua Label</legend>
    <div class="stats" id="shipment-stats">
      <div class="stat"><div class="value" id="s-planned">0</div><div class="label">Sepatutnya</div></div>
      <div class="stat"><div class="value" id="s-packed">0</div><div class="label">Sudah Discan</div></div>
      <div class="stat"><div class="value" id="s-missing">0</div><div class="label">Masih Kurang</div></div>
    </div>
    <form id="scan-form">
      <label>Scan label pada unit yang sedang dimasukkan ke dalam bungkusan
        <input name="code" autofocus autocomplete="off" placeholder="Imbas QR di sini…" required>
      </label>
      <button type="submit">Scan Label untuk Packing</button>
    </form>
    <div id="scan-result"></div>
    <button id="close-btn" class="secondary" style="margin-top:16px">Selesai Packing &amp; Semak Kekurangan</button>
    <div id="close-result"></div>
  </fieldset>
  </div>

  <script src="/nav.js"></script>
  <script>
    let currentShipmentId = null;
    let currentOrderLineId = null;
    let currentBatchId = null;
    let currentPackingQuantity = 0;
    let linesById = new Map();
    let ordersCache = [];
    let batchesCache = [];

    // Izzat's feedback: the old single dropdown crammed customer + invoice +
    // product into one long line per option, forcing a scroll-and-read
    // search through every order line in the system to find the right one.
    // Real-world habit is hierarchical -- find the customer's folder, then
    // the invoice inside it, then the delivery order (production batch)
    // being shipped -- so this replaces it with three cascading selects
    // matching that search order instead of one flat list.
    async function loadCustomers() {
      const orders = await fetch('/api/orders').then(r => r.json());
      ordersCache = orders;
      linesById = new Map(orders.flatMap((o) => o.lines.map((l) => [l.id, { ...l, orderRef: o.order_reference, customerName: o.customer_name }])));

      const customersById = new Map();
      for (const o of orders) {
        if (!customersById.has(o.customer_id)) customersById.set(o.customer_id, o.customer_name);
      }
      const select = document.getElementById('customer-select');
      if (!customersById.size) {
        select.innerHTML = '<option value="">Belum ada tempahan</option>';
        return;
      }
      select.innerHTML = '<option value="">Pilih customer…</option>' +
        [...customersById.entries()].map(([id, name]) => `<option value="${id}">${name}</option>`).join('');
    }

    function updateInvoiceOptions() {
      const customerId = document.getElementById('customer-select').value;
      const select = document.getElementById('invoice-select');
      resetBatchOptions();
      if (!customerId) { select.innerHTML = '<option value="">Pilih customer dahulu</option>'; return; }
      const orders = ordersCache.filter((o) => o.customer_id === customerId);
      select.innerHTML = orders.length
        ? '<option value="">Pilih tempahan…</option>' + orders.map((o) => `<option value="${o.id}">${o.order_reference}</option>`).join('')
        : '<option value="">Tiada tempahan untuk customer ini</option>';
    }

    function resetBatchOptions() {
      document.getElementById('batch-select').innerHTML = '<option value="">Pilih tempahan dahulu</option>';
      currentOrderLineId = null;
      currentBatchId = null;
      currentPackingQuantity = 0;
      document.getElementById('start-packing-btn').disabled = true;
      document.getElementById('selected-batch-summary').textContent = 'Pilih tempahan dan batch dahulu.';
      loadExistingShipments();
    }

    async function updateBatchOptions() {
      const orderId = document.getElementById('invoice-select').value;
      const select = document.getElementById('batch-select');
      currentOrderLineId = null;
      currentBatchId = null;
      currentPackingQuantity = 0;
      if (!orderId) { select.innerHTML = '<option value="">Pilih tempahan dahulu</option>'; loadExistingShipments(); return; }
      if (!batchesCache.length) batchesCache = await fetch('/api/production-batches').then(r => r.json());
      const batches = batchesCache.filter((b) => b.order_id === orderId);
      select.innerHTML = batches.length
        ? '<option value="">Pilih batch…</option>' + batches.map((b) =>
            `<option value="${b.id}">${b.product_name} · ${b.variant_label} · Batch ${b.batch_number} · ${b.registered_count} label</option>`
          ).join('')
        : '<option value="">Belum ada batch untuk tempahan ini</option>';
      loadExistingShipments();
    }

    document.getElementById('customer-select').addEventListener('change', updateInvoiceOptions);
    document.getElementById('invoice-select').addEventListener('change', updateBatchOptions);
    document.getElementById('batch-select').addEventListener('change', () => {
      currentBatchId = document.getElementById('batch-select').value || null;
      const batch = batchesCache.find((b) => b.id === currentBatchId);
      currentOrderLineId = batch?.order_line_id || null;
      currentPackingQuantity = Number(batch?.registered_count || 0);
      const startButton = document.getElementById('start-packing-btn');
      startButton.disabled = !batch;
      document.getElementById('selected-batch-summary').textContent = batch
        ? `${batch.customer_name} · ${batch.order_reference} · ${batch.product_name} · ${batch.variant_label} · Batch ${batch.batch_number}`
        : 'Pilih tempahan dan batch dahulu.';
      loadExistingShipments();
    });

    // Field Simulation P3 (Shipment Split): fixes two real gaps found when
    // an order is fulfilled across multiple shipments -- (1) there was no
    // order-level rollup, only a raw per-shipment list an operator had to
    // add up by hand, and (2) reloading this page (browser closed, staff
    // shift change, crash) made an already-OPEN shipment permanently
    // unreachable -- there was no way to resume scanning into or even
    // close it, since currentShipmentId only ever got set at the moment a
    // NEW shipment was created in this page's own memory.
    // O5 finding: this rollup only ever refreshed on line-select or after
    // Close/Dispatch -- while actively scanning into an OPEN shipment, it
    // sat frozen at whatever it read on page load, showing "Packed: 0"
    // even as the scan-section stats right below correctly climbed to 1,
    // 2, 3... Split out so a scan can refresh just this number without
    // touching (or hiding) the active scan section itself.
    async function refreshOrderRollup(lineId) {
      const rollupEl = document.getElementById('order-rollup');
      const line = linesById.get(lineId);
      if (!line) { rollupEl.textContent = ''; return; }
      const rows = await fetch(`/api/order-lines/${lineId}/shipments`).then(r => r.json());
      const packedTotal = rows.reduce((sum, s) => sum + s.scanned_count, 0);
      // Core Production Simulation, Priority 4 (partial shipment): after
      // the pivot, all labels exist from day one, so "Remaining" here no
      // longer means "not yet produced" -- confirmed live it can mean
      // "produced and labeled, just not boxed into a shipment yet." Worse,
      // "Packed" itself was ambiguous between "boxed into a CLOSED
      // shipment still sitting in the warehouse" and "actually left on a
      // DISPATCHED shipment" -- a real distinction Izzat's own business
      // cares about (has it actually gone out the door?). Split it out so
      // the rollup answers Director's three states directly: produced,
      // packed-not-dispatched, and dispatched.
      const dispatchedTotal = rows.filter((s) => s.status === 'DISPATCHED').reduce((sum, s) => sum + s.scanned_count, 0);
      const packedNotDispatched = packedTotal - dispatchedTotal;
      rollupEl.textContent = `Ditempah: ${line.quantity_ordered} · Sudah discan untuk packing: ${packedTotal} · Baki: ${Math.max(0, line.quantity_ordered - packedTotal)}`;
      const batch = batchesCache.find((item) => item.id === currentBatchId);
      const remainingForLine = Math.max(0, Number(line.quantity_ordered) - packedTotal);
      currentPackingQuantity = Math.min(Number(batch?.registered_count || 0), remainingForLine);
      document.getElementById('start-packing-btn').disabled = currentPackingQuantity < 1;
      document.getElementById('selected-batch-summary').textContent = batch
        ? `${batch.customer_name} · ${batch.order_reference} · ${batch.product_name} · ${batch.variant_label} · Batch ${batch.batch_number} · Baki untuk scan sekarang: ${currentPackingQuantity}`
        : 'Pilih tempahan dan batch dahulu.';
      // Same staleness applied to each shipment's own row (e.g. "Shipment 1
      // (OPEN, 1/60)" frozen while the live scan count was already at 2) --
      // update it in place rather than re-rendering the whole list, which
      // would also nuke any open dispatch-destination input mid-type.
      for (const s of rows) {
        const span = document.getElementById(`shipment-row-label-${s.id}`);
        if (span) span.textContent = shipmentRowLabel(s);
      }
      return rows;
    }

    // Shown after DISPATCHED so an operator checking the shipment list later
    // (or right after dispatching) can see WHERE it went without opening
    // every unit's individual history -- Field Simulation Pass 3 Scenario 3
    // found the destination typed at dispatch was recorded per-unit only,
    // never surfaced at the shipment level at all.
    function shipmentRowLabel(s) {
      const status = s.status === 'OPEN' ? 'Sedang Packing' : s.status === 'CLOSED' ? 'Selesai' : s.status;
      return `${s.reference} · ${status} · ${s.scanned_count}/${s.planned_quantity} discan`;
    }

    async function loadExistingShipments() {
      const lineId = currentOrderLineId;
      const el = document.getElementById('existing-shipments');
      document.getElementById('scan-section').hidden = true;
      currentShipmentId = null;
      if (!lineId) { document.getElementById('order-rollup').textContent = ''; el.textContent = ''; return; }
      const line = linesById.get(lineId);
      const rows = await refreshOrderRollup(lineId);
      if (!rows.length) {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = rows.map((s) => `
        <div style="margin:4px 0">
          <span id="shipment-row-label-${s.id}">${shipmentRowLabel(s)}</span>
          ${s.status === 'OPEN' ? ` <button type="button" data-resume="${s.id}" style="padding:5px 10px;font-size:12px">Sambung Scan</button>` : ''}
        </div>
      `).join('');
      el.querySelectorAll('button[data-resume]').forEach((btn) => {
        btn.addEventListener('click', () => resumeShipment(btn.dataset.resume));
      });
    }
    async function resumeShipment(shipmentId) {
      const shipment = await fetch(`/api/shipments/${shipmentId}`).then(r => r.json());
      if (shipment.error) return;
      currentShipmentId = shipmentId;
      document.getElementById('shipment-result').innerHTML = `<div class="msg ok">Sambung packing “${shipment.reference}”. Scan semua label di bawah.</div>`;
      document.getElementById('scan-section').hidden = false;
      document.getElementById('s-planned').textContent = shipment.planned_quantity;
      document.getElementById('s-packed').textContent = shipment.scannedCount;
      document.getElementById('s-missing').textContent = Math.max(0, shipment.planned_quantity - shipment.scannedCount);
      document.getElementById('scan-result').innerHTML = '';
      document.getElementById('close-result').innerHTML = '';
      document.querySelector('#scan-form input[name="code"]').focus();
    }

    document.getElementById('start-packing-btn').addEventListener('click', async () => {
      const result = document.getElementById('shipment-result');
      result.innerHTML = '';
      try {
        const orderLineId = currentOrderLineId;
        const batch = batchesCache.find((b) => b.id === currentBatchId);
        if (!orderLineId || !batch) throw new Error('Pilih customer, tempahan dan batch dahulu.');
        const plannedQuantity = currentPackingQuantity;
        if (!plannedQuantity) throw new Error('Batch ini belum mempunyai label untuk discan.');
        const reference = `Packing ${batch.order_reference} · Batch ${batch.batch_number}`;
        const shipment = await fetch('/api/shipments', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderLineId, reference, plannedQuantity }),
        }).then(r => r.json());
        if (shipment.error) throw new Error(shipment.error);

        currentShipmentId = shipment.id;
        result.innerHTML = `<div class="msg ok">Packing dimulakan. Scan kesemua ${shipment.plannedQuantity} label.</div>`;
        document.getElementById('scan-section').hidden = false;
        document.getElementById('s-planned').textContent = shipment.plannedQuantity;
        document.getElementById('s-packed').textContent = 0;
        document.getElementById('s-missing').textContent = shipment.plannedQuantity;
        document.querySelector('#scan-form input[name="code"]').focus();
      } catch (err) {
        result.innerHTML = `<div class="msg error">${err.message}</div>`;
      }
    });

    document.getElementById('scan-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const code = new FormData(form).get('code').trim();
      const result = document.getElementById('scan-result');
      try {
        const httpRes = await fetch(`/api/shipments/${currentShipmentId}/scans`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, actor: (window.LabelismActor && window.LabelismActor.get()) || 'unknown' }),
        });
        const res = await httpRes.json();
        if (res.error) {
          result.innerHTML = `<div class="msg error">${res.error}</div>`;
        } else {
          // Core Production Simulation, Priority 2B (duplicate label):
          // "already scanned" alone reads as a harmless dedup notice (an
          // operator naturally thinks "oh, I already did this one") -- it
          // gives no cue that a SECOND physical garment holding a
          // duplicated/counterfeit copy of the same label would produce
          // this exact same message. The system genuinely cannot tell
          // those two cases apart from a code match alone (a real,
          // acknowledged boundary, not a bug to fix) -- so the wording
          // has to carry the ambiguity instead, prompting a human check
          // rather than a passive "already scanned = safe to ignore."
          result.innerHTML = `<div class="msg ${res.alreadyScanned ? 'error' : 'ok'}">${res.humanCode} · ${res.product}${res.alreadyScanned ? ' — label ini sudah discan untuk packing. Jika ini unit fizikal yang berlainan, hentikan proses dan semak label pendua.' : ' — berjaya discan'}</div>`;
          const shipment = await fetch(`/api/shipments/${currentShipmentId}`).then(r => r.json());
          document.getElementById('s-packed').textContent = shipment.scannedCount;
          document.getElementById('s-missing').textContent = Math.max(0, shipment.planned_quantity - shipment.scannedCount);
          if (!res.alreadyScanned) refreshOrderRollup(currentOrderLineId);
        }
      } catch (err) {
        result.innerHTML = `<div class="msg error">Tidak dapat menghubungi server (${err.message}).</div>`;
      }
      form.reset();
      form.code.focus();
    });

    document.getElementById('close-btn').addEventListener('click', async () => {
      const res = await fetch(`/api/shipments/${currentShipmentId}/close`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ actor: (window.LabelismActor && window.LabelismActor.get()) || 'unknown' }),
      }).then(r => r.json());
      // Core Production Simulation, Priority 1 (production shortfall):
      // a bare "MISSING 2" told Izzat something was wrong but not which
      // two of the ten units to go find -- confirmed live this meant
      // manually cross-checking the full unit list by hand. Name the
      // actual codes so packing/QC can act immediately.
      // Gate B readiness fix: a missing count can be true while the
      // SPECIFIC units behind it can't be -- e.g. this shipment only
      // planned to take part of what's on hand, with the rest legitimately
      // held for a later shipment. Naming units in that case would imply
      // more is unaccounted for than really is.
      const missingDetail = res.missing > 0
        ? res.missingUnitsUncertain
          ? ` — unit tertentu belum dapat dikenal pasti kerana terdapat unit lain yang mungkin untuk batch penghantaran seterusnya.`
          : res.missingUnits && res.missingUnits.length
          ? ` — label unit ${res.missingUnits.join(', ')} tidak discan`
          : ''
        : '';
      const message = res.error
        ? `<div class="msg error">${res.error}</div>`
        : `<div class="msg ${res.missing > 0 ? 'error' : 'ok'}">Packing selesai. Sepatutnya ${res.plannedQuantity}, discan ${res.packedCount}${res.missing > 0 ? `, MASIH KURANG ${res.missing}${missingDetail}` : ' — semua unit cukup'}.</div>`;
      document.getElementById('close-result').innerHTML = message;
      if (!res.error) {
        // O5 finding: loadExistingShipments() hides the whole scan-section
        // (including #close-result) as soon as it runs, so the missing-
        // count confirmation flashed and vanished before an operator could
        // read it. Show it where it survives that hide -- #shipment-result
        // sits above the section that gets hidden.
        document.getElementById('shipment-result').innerHTML = message;
        loadExistingShipments();
      }
    });

    loadCustomers();
  </script>
</body>
</html>
