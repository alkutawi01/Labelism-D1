<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orders — Labelism</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
  <header class="page-header">
    <h1>Customers &amp; Orders</h1>
    <p class="muted">Track who ordered what before production starts. An order line is fulfilled by one or more production batches -- created here, then produced in Product Setup.</p>
  </header>

  <fieldset>
    <legend>Customer</legend>
    <label class="inline">
      <input type="radio" name="customerMode" value="existing" checked> Existing customer
    </label>
    <label class="inline">
      <input type="radio" name="customerMode" value="new"> New customer
    </label>
    <div id="existing-customer-field">
      <label>Customer
        <select name="existingCustomerId"><option value="">Loading…</option></select>
      </label>
    </div>
    <div id="new-customer-field" hidden>
      <label>Customer name
        <input name="newCustomerName" placeholder="e.g. ABC School">
      </label>
    </div>
  </fieldset>

  <form id="order-form">
    <fieldset>
      <legend>Order</legend>
      <label>Order reference
        <input name="orderReference" required placeholder="e.g. Order #001, Robothon 2026">
      </label>
      <label>Order date (optional)
        <input name="orderDate" type="date">
      </label>
      <label>Due date (optional)
        <input name="dueDate" type="date">
      </label>
      <label>Notes (optional)
        <input name="orderNotes" placeholder="anything worth keeping for reference">
      </label>
      <button type="submit">Create Order</button>
    </fieldset>
  </form>

  <div id="order-result"></div>

  <fieldset id="line-section" hidden>
    <legend>Order Line</legend>
    <p class="muted" id="line-order-label"></p>
    <form id="line-form">
      <label>What's being ordered
        <input name="description" placeholder="e.g. Jersey Home, Size M -- plain text is fine, no product needed yet">
      </label>
      <label>Quantity ordered
        <input name="quantityOrdered" type="number" min="1" required placeholder="e.g. 50">
      </label>
      <label>Notes (optional)
        <input name="lineNotes" placeholder="e.g. customer changed this to Size L on 20/9">
      </label>
      <button type="submit">Add Line</button>
    </form>
    <div id="line-result"></div>
  </fieldset>

  <table id="orders-table" hidden>
    <thead><tr><th>Customer</th><th>Order</th><th>Lines</th><th>Notes</th><th></th></tr></thead>
    <tbody id="orders-body"></tbody>
  </table>
  </div>

  <script src="/nav.js"></script>
  <script>
    const form = document.getElementById('order-form');
    const existingField = document.getElementById('existing-customer-field');
    const newField = document.getElementById('new-customer-field');
    const existingSelect = existingField.querySelector('select');
    let currentOrderId = null;

    function updateCustomerModeUI() {
      const mode = new FormData(form).get('customerMode') ?? document.querySelector('input[name=customerMode]:checked').value;
      existingField.hidden = mode !== 'existing';
      newField.hidden = mode !== 'new';
    }
    document.querySelectorAll('input[name=customerMode]').forEach((el) => el.addEventListener('change', updateCustomerModeUI));

    async function loadCustomers() {
      const rows = await fetch('/api/customers').then(r => r.json());
      existingSelect.innerHTML = rows.length
        ? rows.map((c) => `<option value="${c.id}">${c.name}</option>`).join('')
        : '<option value="">No customers yet -- create one</option>';
    }

    // Field Simulation Pass 3 Scenario 6: a line's notes is the only place
    // a post-creation change ("customer changed this to Size L") can be
    // recorded today, since quantity_ordered/variant_id have no edit
    // capability at all (a real gap, deferred pending Director's design
    // call same as the Scenario 1 batch order-link correction). Shown
    // inline per line, with a lightweight edit control, since this is the
    // one list an operator would check to notice a change was flagged.
    function lineNoteHtml(l) {
      const noteText = l.notes ? l.notes : '<span class="muted">no note</span>';
      return `
        <span data-note-display="${l.id}">
          <span id="line-note-${l.id}">${noteText}</span>
          <button type="button" class="secondary" data-edit-note="${l.id}" style="padding:1px 6px;font-size:11px">Edit note</button>
        </span>
        <span data-note-form="${l.id}" hidden>
          <input type="text" data-note-input="${l.id}" value="${l.notes ? l.notes.replace(/"/g, '&quot;') : ''}" placeholder="e.g. customer changed this to Size L on 20/9" style="font-size:12px;padding:3px;width:220px">
          <button type="button" data-save-note="${l.id}" style="padding:1px 6px;font-size:11px">Save</button>
        </span>`;
    }

    async function loadOrders() {
      const rows = await fetch('/api/orders').then(r => r.json());
      if (!rows.length) return;
      document.getElementById('orders-table').hidden = false;
      document.getElementById('orders-body').innerHTML = rows.map((o) => `
        <tr>
          <td>${o.customer_name}</td>
          <td>${o.order_reference}</td>
          <td>${o.lines.length ? o.lines.map((l) => `${l.description || (l.product_name + ' · ' + l.variant_label)} &times; ${l.quantity_ordered}<br><span class="muted" style="font-size:12px">${lineNoteHtml(l)}</span>`).join('<hr style="border:none;border-top:1px solid var(--line);margin:6px 0">') : '<span class="muted">No lines yet</span>'}</td>
          <td>${o.notes ? o.notes : '<span class="muted">—</span>'}</td>
          <td><button type="button" class="secondary" data-reconcile="${o.id}" style="font-size:12px;padding:3px 8px">Reconciliation</button></td>
        </tr>
        <tr id="reconcile-row-${o.id}" hidden><td colspan="5" id="reconcile-${o.id}"></td></tr>
      `).join('');
      const body = document.getElementById('orders-body');
      // Priority 6 (F6-001): the one place a supervisor can see, per order,
      // whether ordered/generated/attached/packed/dispatched actually line
      // up -- instead of cross-referencing Product Setup and Pack & Ship
      // per order line by hand.
      body.querySelectorAll('button[data-reconcile]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const orderId = btn.dataset.reconcile;
          const row = document.getElementById(`reconcile-row-${orderId}`);
          if (!row.hidden) { row.hidden = true; return; }
          const cell = document.getElementById(`reconcile-${orderId}`);
          cell.innerHTML = '<span class="muted">Loading…</span>';
          row.hidden = false;
          const data = await fetch(`/api/orders/${orderId}/reconciliation`).then(r => r.json());
          if (data.error) { cell.innerHTML = `<div class="msg error">${data.error}</div>`; return; }
          const rowsHtml = data.lines.map((l) => {
            const label = l.description || `${l.product_name} · ${l.variant_label}`;
            const flag = l.units_generated !== l.quantity_ordered
              ? ` <span class="msg error" style="display:inline;padding:1px 6px">generated ≠ ordered</span>`
              : '';
            return `<tr>
              <td>${label}</td>
              <td>${l.quantity_ordered}</td>
              <td>${l.units_generated}${flag}</td>
              <td>${l.units_attached}</td>
              <td>${l.units_packed}</td>
              <td>${l.units_dispatched}</td>
            </tr>`;
          }).join('');
          cell.innerHTML = `
            <table style="margin:6px 0">
              <thead><tr><th>Line</th><th>Ordered</th><th>Labels generated</th><th>Attached</th><th>Packed</th><th>Dispatched</th></tr></thead>
              <tbody>${rowsHtml}</tbody>
              <tfoot><tr style="font-weight:600">
                <td>Total</td><td>${data.totals.ordered}</td><td>${data.totals.generated}</td>
                <td>${data.totals.attached}</td><td>${data.totals.packed}</td><td>${data.totals.dispatched}</td>
              </tr></tfoot>
            </table>`;
        });
      });
      body.querySelectorAll('button[data-edit-note]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const lineId = btn.dataset.editNote;
          body.querySelector(`[data-note-display="${lineId}"]`).hidden = true;
          body.querySelector(`[data-note-form="${lineId}"]`).hidden = false;
        });
      });
      body.querySelectorAll('button[data-save-note]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const lineId = btn.dataset.saveNote;
          const value = body.querySelector(`[data-note-input="${lineId}"]`).value.trim();
          const res = await fetch(`/api/order-lines/${lineId}/notes`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notes: value || null }),
          }).then(r => r.json());
          if (!res.error) loadOrders();
        });
      });
    }

    document.querySelectorAll('input[name=customerMode]').forEach((el) => el.addEventListener('change', updateCustomerModeUI));

    document.getElementById('order-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = document.getElementById('order-result');
      result.innerHTML = '';
      try {
        const mode = document.querySelector('input[name=customerMode]:checked').value;
        let customerId;
        if (mode === 'new') {
          const name = newField.querySelector('[name=newCustomerName]').value.trim();
          if (!name) throw new Error('Customer name is required.');
          const customer = await fetch('/api/customers', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          }).then(r => r.json());
          if (customer.error) throw new Error(customer.error);
          customerId = customer.id;
        } else {
          customerId = existingSelect.value;
          if (!customerId) throw new Error('Select an existing customer.');
        }

        const data = Object.fromEntries(new FormData(form));
        const order = await fetch('/api/orders', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerId,
            orderReference: data.orderReference,
            orderDate: data.orderDate || undefined,
            dueDate: data.dueDate || undefined,
            notes: data.orderNotes || undefined,
          }),
        }).then(r => r.json());
        if (order.error) throw new Error(order.error);

        currentOrderId = order.id;
        result.innerHTML = `<div class="msg ok">Order "${order.orderReference}" created.</div>`;
        document.getElementById('line-section').hidden = false;
        document.getElementById('line-order-label').textContent = `Adding lines to: ${order.orderReference}`;
        loadCustomers();
        loadOrders();
      } catch (err) {
        result.innerHTML = `<div class="msg error">${err.message}</div>`;
      }
    });

    document.getElementById('line-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = document.getElementById('line-result');
      result.innerHTML = '';
      try {
        if (!currentOrderId) throw new Error('Create an order first.');
        const data = Object.fromEntries(new FormData(e.target));
        const line = await fetch('/api/order-lines', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            orderId: currentOrderId,
            description: data.description || undefined,
            quantityOrdered: Number(data.quantityOrdered),
            notes: data.lineNotes || undefined,
          }),
        }).then(r => r.json());
        if (line.error) throw new Error(line.error);
        result.innerHTML = `<div class="msg ok">Line added. To produce it, go to <a href="/product-setup.html?orderLineId=${line.id}">Product Setup</a> and create a batch -- it'll be linked to this line.</div>`;
        e.target.reset();
        loadOrders();
      } catch (err) {
        result.innerHTML = `<div class="msg error">${err.message}</div>`;
      }
    });

    updateCustomerModeUI();
    loadCustomers();
    loadOrders();
  </script>
</body>
</html>
