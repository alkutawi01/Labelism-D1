<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Print Labels — Labelism</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* Real thermal label sizes (mm), matched to what an Xprinter-class
       label printer actually loads -- one physical label per printed
       page, not a grid on A4. @page size is set dynamically per the
       selected size (see script below). */
    @media print {
      .no-print { display: none !important; }
      body { max-width: none; padding: 0; margin: 0 !important; }
      .page { max-width: none; padding: 0; margin: 0; }
      .label-grid { display: block; }
      .label {
        border: none;
        border-radius: 0;
        page-break-after: always;
        width: var(--label-w);
        height: var(--label-h);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2mm;
      }
      .label:last-child { page-break-after: auto; }

      /* A4 sheet mode: many labels per page, cut by hand -- for testing
         before a thermal printer/driver is set up. Dashed border doubles
         as a cut guide. */
      body.print-a4 .label-grid { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 8mm; }
      body.print-a4 .label {
        width: auto; height: auto;
        page-break-after: auto;
        page-break-inside: avoid;
        border: 1px dashed #999;
        border-radius: 0;
        padding: 4mm;
      }
    }
    .label-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .label {
      border: 1px dashed var(--line);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      background: var(--surface);
    }
    .label .context { font-size: 9px; color: var(--muted); line-height: 1.15; margin-bottom: 3px; }
    .label .product { font-size: 10px; color: var(--muted); line-height: 1.2; }
    .label .variant { font-size: 12px; font-weight: 700; line-height: 1.2; margin-top: 1px; }
    .label .qr { display: flex; justify-content: center; margin: 6px 0; }
    .label .code { font-weight: 600; font-variant-numeric: tabular-nums; }
    .label .status { font-size: 11px; color: var(--muted); }
    .label button { width: 100%; margin-top: 6px; padding: 6px; font-size: 12px; }
    .label.confirmed { border-style: solid; border-color: var(--ok); }
  </style>
</head>
<body>
  <div class="page">
  <header class="page-header no-print">
    <h1>Print Labels</h1>
    <p class="muted">Print one label per copy, attach it, then scan the attached QR to verify it's the right label before confirming.</p>
  </header>

  <label class="no-print">Production batch
    <select id="batch-select"><option value="">Loading…</option></select>
  </label>

  <label class="no-print">Label size (physical sticker size loaded in your printer)
    <select id="size-select">
      <option value="40x30">40mm x 30mm (thermal)</option>
      <option value="50x30">50mm x 30mm (thermal)</option>
      <option value="60x40" selected>60mm x 40mm (thermal)</option>
      <option value="a4">A4 sheet — many per page, cut yourself</option>
    </select>
  </label>

  <p class="muted no-print" id="unit-count-summary" style="margin-top:12px"></p>
  <div class="no-print" id="pending-attachment" style="margin-top:8px"></div>

  <div class="no-print" style="margin-top:12px">
    <button id="print-btn" class="secondary">Print this page</button>
  </div>

  <div id="pagination" class="no-print" style="margin-top:14px;display:flex;gap:10px;align-items:center"></div>
  <div id="grid" class="label-grid"></div>
  </div>

  <script src="/nav.js"></script>
  <script>
    const select = document.getElementById('batch-select');
    const sizeSelect = document.getElementById('size-select');
    const grid = document.getElementById('grid');

    const SIZES = {
      '40x30': { w: 40, h: 30, qr: 60 },
      '50x30': { w: 50, h: 30, qr: 70 },
      '60x40': { w: 60, h: 40, qr: 90 },
      'a4': { a4: true, qr: 110 },
    };

    function applyPageSize() {
      const s = SIZES[sizeSelect.value];
      let styleTag = document.getElementById('page-size-style');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'page-size-style';
        document.head.appendChild(styleTag);
      }
      if (s.a4) {
        document.body.classList.add('print-a4');
        styleTag.textContent = `@page { size: A4; margin: 10mm; }`;
      } else {
        document.body.classList.remove('print-a4');
        styleTag.textContent = `
          @page { size: ${s.w}mm ${s.h}mm; margin: 0; }
          :root { --label-w: ${s.w}mm; --label-h: ${s.h}mm; }
        `;
      }
    }
    sizeSelect.addEventListener('change', () => { applyPageSize(); loadUnits(); });

    let batchesCache = [];

    async function loadBatches() {
      const rows = await fetch('/api/production-batches').then(r => r.json());
      batchesCache = rows;
      if (!rows.length) {
        select.innerHTML = '<option value="">No production batches yet</option>';
        return;
      }
      select.innerHTML = rows.map(r =>
        `<option value="${r.id}">${r.product_name} · ${r.variant_label} · Batch ${r.batch_number}${r.order_reference ? ` -- ${r.order_reference}` : ''}</option>`
      ).join('');
      const params = new URLSearchParams(location.search);
      if (params.get('batchId')) select.value = params.get('batchId');
      loadUnits();
    }

    const PAGE_SIZE = 30;
    let currentPage = 1;
    let currentUnits = [];

    function parseBatchContext(batch) {
      if (!batch || !batch.notes) return '';
      try {
        const parsed = JSON.parse(batch.notes);
        return parsed.context || '';
      } catch {
        return '';
      }
    }

    async function loadUnits(resetPage = true) {
      if (!select.value) return;
      currentUnits = await fetch(`/api/production-batches/${select.value}/units`).then(r => r.json());
      if (resetPage) currentPage = 1;
      renderUnits();
    }

    // Screen shows one page at a time (large batches, e.g. 1000+ units,
    // would otherwise mean endless scrolling just to review before
    // printing) -- but every unit's QR is still rendered into the DOM up
    // front, and printing always includes all of them regardless of which
    // page is currently shown on screen (see beforeprint/afterprint below).
    function renderUnits() {
      const units = currentUnits;
      const qrSize = SIZES[sizeSelect.value].qr;
      const batch = batchesCache.find(b => b.id === select.value);
      const batchContext = parseBatchContext(batch);
      grid.innerHTML = '';

      // O4 finding: for a batch small enough to fit on one screen (<=30
      // units), nothing told the operator how many labels were about to
      // print -- the pagination summary only appeared once a batch was
      // large enough to need pages. Always state it plainly before Print.
      const confirmedCount = units.filter((u) => u.label_confirmed_at).length;
      document.getElementById('unit-count-summary').textContent = units.length
        ? `${units.length} unit${units.length === 1 ? '' : 's'} in this batch — printing will produce ${units.length} label${units.length === 1 ? '' : 's'}.${confirmedCount ? ` ${confirmedCount} already confirmed attached.` : ''}`
        : '';

      // Field Simulation Pass 3 Scenario B2 (exception recovery during
      // handover): confirmed live that a scattered handful of pending
      // units among many (e.g. 3 of 65) IS visually distinguishable once
      // you find its card -- but with pagination hiding most of the batch
      // by default, an operator picking up someone else's unfinished work
      // had no way to know WHICH codes still need attention without
      // paging through the entire grid looking for the ones missing the
      // green border. Same problem Stocktake already solved with its
      // dedicated "Not Observed" list -- applying the same pattern here:
      // name the pending codes directly, with a jump-to-card shortcut.
      const pendingEl = document.getElementById('pending-attachment');
      const pending = units.filter((u) => !u.label_confirmed_at);
      pendingEl.innerHTML = pending.length
        ? `<div class="msg error">${pending.length} unit${pending.length === 1 ? '' : 's'} still awaiting attachment: ${pending.map((u) => `<button type="button" data-jump="${u.id}" style="padding:1px 7px;font-size:12px;margin:2px 3px 0 0">${u.human_code}</button>`).join('')}</div>`
        : '';
      pendingEl.querySelectorAll('button[data-jump]').forEach((btn) => {
        btn.addEventListener('click', () => jumpToUnit(btn.dataset.jump));
      });

      units.forEach(u => {
        const cell = document.createElement('div');
        cell.id = `label-cell-${u.id}`;
        cell.className = 'label' + (u.label_confirmed_at ? ' confirmed' : '');
        const verified = !!u.label_scan_verified;
        cell.innerHTML = `
          ${batchContext ? `<div class="context">${batchContext}</div>` : ''}
          ${batch ? `<div class="product">${batch.product_name}</div><div class="variant">${batch.variant_label}</div>` : ''}
          <div class="qr" id="qr-${u.id}"></div>
          <div class="code">UNIT ${u.human_code}</div>
          <div class="status no-print">${u.label_confirmed_at ? 'Attachment confirmed' : verified ? 'Scan verified — ready to confirm' : 'Awaiting attachment scan'}</div>
          ${u.label_confirmed_at ? `
            <button class="no-print" disabled>Confirmed</button>
          ` : verified ? `
            <button class="no-print" data-id="${u.id}" data-action="confirm">Confirm Attachment</button>
          ` : `
            <form class="no-print scan-verify-form" data-id="${u.id}" style="margin-top:6px">
              <input name="code" placeholder="Scan the attached label's QR" style="font-size:12px;padding:6px" required>
              <button type="submit" style="margin-top:4px">Verify Scan</button>
            </form>
            <div class="no-print scan-verify-result" id="scan-verify-result-${u.id}"></div>
          `}
          ${!u.label_confirmed_at ? `
            <button class="no-print secondary" data-id="${u.id}" data-action="reissue">
              Lost — Reissue
            </button>
            <div class="no-print reissue-confirm" id="reissue-confirm-${u.id}" hidden style="margin-top:6px">
              <div class="muted" style="font-size:11px;margin-bottom:4px">
                This permanently invalidates the current QR and prints a new one. Only if this label was lost/spoiled before attaching.
              </div>
              <button class="no-print" data-id="${u.id}" data-action="reissue-confirm">Yes, reissue</button>
              <button class="no-print secondary" data-id="${u.id}" data-action="reissue-cancel">Cancel</button>
            </div>
          ` : ''}
        `;
        grid.appendChild(cell);
        new QRCode(document.getElementById(`qr-${u.id}`), {
          text: `${location.origin}/scan.html?code=${u.internal_token}`,
          width: qrSize,
          height: qrSize,
        });
      });
      grid.querySelectorAll('button[data-action="confirm"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch(`/api/units/${btn.dataset.id}/confirm-label`, { method: 'POST' });
          loadUnits(false);
        });
      });
      // P2 fix: attachment must be verified by actually scanning the
      // physical label before Confirm Attachment is even shown -- catches
      // both a swapped label (scan resolves to a different unit) and a
      // mis-click (nothing was scanned at all).
      grid.querySelectorAll('form.scan-verify-form').forEach(form => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const unitId = form.dataset.id;
          const code = new FormData(form).get('code').trim();
          const resultEl = document.getElementById(`scan-verify-result-${unitId}`);
          const res = await fetch(`/api/units/${unitId}/verify-label-scan`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, actor: (window.LabelismActor && window.LabelismActor.get()) || 'izzat' }),
          }).then(r => r.json());
          if (res.error) {
            resultEl.innerHTML = `<div class="msg error">${res.error}</div>`;
            return;
          }
          if (!res.verified) {
            resultEl.innerHTML =
              res.reason === 'mismatch'
                ? `<div class="msg error">Wrong label — this QR belongs to Unit ${res.actualUnit.humanCode} (${res.actualUnit.product} · ${res.actualUnit.variant}), not this one.</div>`
                : res.reason === 'ambiguous'
                ? `<div class="msg error">That code matches more than one unit — scan the QR itself instead of typing a short code.</div>`
                : `<div class="msg error">No unit matches that code.</div>`;
            form.code.value = '';
            form.code.focus();
            return;
          }
          loadUnits(false);
        });
      });
      // Inline confirm, not window.confirm() -- a native dialog looks out of
      // place here and (per the same lesson already learned on scan.html's
      // transfer form) cannot be driven by automated browser testing at all,
      // since it auto-dismisses.
      grid.querySelectorAll('button[data-action="reissue"]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById(`reissue-confirm-${btn.dataset.id}`).hidden = false;
        });
      });
      grid.querySelectorAll('button[data-action="reissue-cancel"]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById(`reissue-confirm-${btn.dataset.id}`).hidden = true;
        });
      });
      grid.querySelectorAll('button[data-action="reissue-confirm"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const res = await fetch(`/api/units/${btn.dataset.id}/reissue-label`, { method: 'POST' }).then(r => r.json());
          if (res.error) {
            grid.querySelector(`#reissue-confirm-${btn.dataset.id} .muted`).insertAdjacentHTML('afterend', `<div class="msg error">${res.error}</div>`);
            return;
          }
          loadUnits(false);
        });
      });

      applyPagination();
    }

    function jumpToUnit(unitId) {
      const index = currentUnits.findIndex((u) => u.id === unitId);
      if (index === -1) return;
      currentPage = Math.floor(index / PAGE_SIZE) + 1;
      applyPagination();
      document.getElementById(`label-cell-${unitId}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function applyPagination() {
      const cards = Array.from(grid.querySelectorAll('.label'));
      const totalPages = Math.max(1, Math.ceil(cards.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      cards.forEach((c, i) => { c.style.display = (i >= start && i < end) ? '' : 'none'; });

      const pagination = document.getElementById('pagination');
      if (cards.length <= PAGE_SIZE) { pagination.innerHTML = ''; return; }
      pagination.innerHTML = `
        <button type="button" class="secondary" id="page-prev" ${currentPage <= 1 ? 'disabled' : ''}>&larr; Previous</button>
        <span class="muted">Page ${currentPage} of ${totalPages} &middot; ${cards.length} units total (showing ${start + 1}-${Math.min(end, cards.length)}; printing includes all ${cards.length})</span>
        <button type="button" class="secondary" id="page-next" ${currentPage >= totalPages ? 'disabled' : ''}>Next &rarr;</button>
      `;
      document.getElementById('page-prev')?.addEventListener('click', () => { currentPage--; applyPagination(); window.scrollTo(0, 0); });
      document.getElementById('page-next')?.addEventListener('click', () => { currentPage++; applyPagination(); window.scrollTo(0, 0); });
    }

    // Printing must always include every unit, regardless of which page is
    // currently shown on screen -- temporarily lift the pagination display
    // override for the duration of the print, then restore it.
    let prePrintDisplays = null;
    window.addEventListener('beforeprint', () => {
      const cards = Array.from(grid.querySelectorAll('.label'));
      prePrintDisplays = cards.map(c => c.style.display);
      cards.forEach(c => { c.style.display = ''; });
    });
    window.addEventListener('afterprint', () => {
      applyPagination();
      prePrintDisplays = null;
    });

    select.addEventListener('change', loadUnits);
    document.getElementById('print-btn').addEventListener('click', () => window.print());
    applyPageSize();
    loadBatches();
  </script>
</body>
</html>
